logging:
  level:
    ROOT: INFO

spring:
  datasource:
    url: jdbc:h2:mem:recipe;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true

  application:
    name: Recipe

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

recipe:
  version: "@project.version@"
  image-location: /tmp/recipe-images

info:
  app:
    name: "Recipe"
    description: "Recipe management application"
