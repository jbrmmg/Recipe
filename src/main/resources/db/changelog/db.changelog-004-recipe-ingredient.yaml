databaseChangeLog:
  - changeSet:
      id: '004-001'
      author: jbrmmg
      changes:
        - createTable:
            tableName: recipe_ingredient
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ri_recipe
                    references: recipe(id)
                    deleteCascade: true
              - column:
                  name: ingredient_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ri_ingredient
                    references: ingredient(id)
              - column:
                  name: quantity
                  type: DECIMAL(10,3)
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(500)
