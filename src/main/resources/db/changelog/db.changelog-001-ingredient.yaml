databaseChangeLog:
  - changeSet:
      id: '001-001'
      author: jbrmmg
      changes:
        - createTable:
            tableName: ingredient
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: default_unit
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: purchase_quantity
                  type: DECIMAL(10,3)
                  constraints:
                    nullable: false
              - column:
                  name: purchase_unit
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
