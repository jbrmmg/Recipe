databaseChangeLog:

  - changeSet:
      id: 014-shopping-list-item
      author: jbrmmg
      changes:
        - createTable:
            tableName: shopping_list_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shopping_list_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sli_shopping_list
                    references: shopping_list(id)
              - column:
                  name: ingredient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ingredient_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: DOUBLE
                  constraints:
                    nullable: false
