logging:
  level:
    ROOT: WARN
    com.jbr.middletier.recipe: DEBUG

spring:
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
    show-sql: false

  liquibase:
    enabled: true

  h2:
    console:
      enabled: false

recipe:
  image-location: /tmp/recipe-images-it
