<mat-sidenav-container class="sidenav-container">

  <mat-sidenav #sidenav mode="over" [fixedInViewport]="true">
    <div class="sidenav-header">
      <mat-icon>restaurant_menu</mat-icon>
      <span>Recipe</span>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/recipes" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>Recipes</span>
      </a>
      <a mat-list-item routerLink="/meal-plans" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>calendar_month</mat-icon>
        <span matListItemTitle>Meal Plans</span>
      </a>
      <a mat-list-item routerLink="/meals" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>restaurant</mat-icon>
        <span matListItemTitle>Meals</span>
      </a>
      <a mat-list-item routerLink="/ingredients" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>kitchen</mat-icon>
        <span matListItemTitle>Ingredients</span>
      </a>
      <a mat-list-item routerLink="/tags" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon matListItemIcon>label</mat-icon>
        <span matListItemTitle>Tags</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Open navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">Recipe</span>
    </mat-toolbar>
    <div class="page-content">
      <router-outlet />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
